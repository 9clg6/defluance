# Minimal Prometheus scrape config for Defluance. `/metrics` has no authentication: keep it on a private network
# (the server only listens on 127.0.0.1 unless DFL_HOST says otherwise, and the Caddyfile does not expose it).
scrape_configs:
  - job_name: defluance
    scrape_interval: 15s
    static_configs:
      - targets: ["defluance:4000"]
