# Defluance with automatic HTTPS, next to whatever else runs on the host. Started by deploy.sh.
# SQLite (the default), notes in ${VAULT_PATH}. Only Caddy publishes ports (80, 443).
name: defluance
services:
  defluance:
    build: .
    image: defluance:prod
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      # push to GitHub with the deploy key in ./ssh (see enable-vault-push.sh); unused without vault_push
      GIT_SSH_COMMAND: ssh -i /home/node/.ssh/id_ed25519 -o UserKnownHostsFile=/home/node/.ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
    volumes:
      - ${VAULT_PATH:-/opt/defluance/vault}:/vault
      - data:/data
      - ./ssh:/home/node/.ssh:ro
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [defluance]
    mem_limit: 128m
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
volumes:
  data:
  caddy-data:
