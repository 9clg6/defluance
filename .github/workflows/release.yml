name: release
# Runs when a version tag is pushed (v0.1.0). Needs the NPM_TOKEN secret.
# Settle the commercial terms in COMMERCIAL.md (price, contact) before the first release.
# The published package.json is generated by scripts/pack-cli.mjs: the repository root stays private.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm build && pnpm test
      - run: pnpm pack:cli --verify
      - run: npm publish dist-npm/defluance-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the same image with the multilingual meaning model baked in: search by meaning with nothing else to set up
      - id: meta-local
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-local,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: EMBED=local
          tags: ${{ steps.meta-local.outputs.tags }}
          labels: ${{ steps.meta-local.outputs.labels }}
          cache-from: type=gha,scope=local
          cache-to: type=gha,mode=max,scope=local

  notes:
    runs-on: ubuntu-latest
    needs: [npm, image]
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
