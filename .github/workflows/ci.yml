name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # the docs are a vault: schema, links and orphans are checked like any other
      - run: node packages/cli/dist/bin.js validate docs
      # the answers of the offline embedder must keep citing the right notes
      - run: node packages/cli/dist/bin.js eval fixtures/vault-eval/questions.yaml --vault fixtures/vault-eval

  e2e:
    # Browser tests with accessibility checks, against the real server. Chrome is preinstalled on the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @defluance/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  cross-browser:
    # The same flows on Chromium, Firefox, WebKit and a phone-sized WebKit, with the e2e framework (tester.army).
    # Deterministic steps only: agent steps need a model key and run with `pnpm --filter @defluance/e2e test:agent`.
    runs-on: ubuntu-latest
    env:
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @defluance/e2e exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @defluance/e2e test:e2e --reporter list,junit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            apps/e2e/.e2e/artifacts
            apps/e2e/.e2e/logs
            apps/e2e/.e2e/junit.xml

  bench:
    # Fails when search, reads or indexing exceed the limits of the requirements (NFR-001, NFR-002).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm bench

  package:
    # What is published is what was tested: install the npm tarball in a clean folder and run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack:cli --verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: defluance:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The container starts and answers
        run: |
          docker run -d --name dfl -p 4000:4000 -e DFL_ADMIN_TOKEN=dfl_ci -v "$PWD/docs:/vault" defluance:ci
          for i in $(seq 1 30); do curl -fs http://localhost:4000/health && exit 0; sleep 2; done
          docker logs dfl; exit 1
