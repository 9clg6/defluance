# Defluance with Postgres. Copy .env.example to .env, set the secrets, then:  docker compose up -d
# Add a public HTTPS address in front of it with:                           docker compose --profile tls up -d
services:
  defluance:
    build: .
    image: ghcr.io/defluance/defluance:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DFL_DATABASE_URL: postgres://defluance:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/defluance
      DFL_SESSION_SECRET: ${DFL_SESSION_SECRET:?set DFL_SESSION_SECRET in .env (at least 32 random characters)}
      DFL_ADMIN_TOKEN: ${DFL_ADMIN_TOKEN:?set DFL_ADMIN_TOKEN in .env, it signs in the first admin}
      DFL_PUBLIC_URL: ${DFL_PUBLIC_URL:-http://localhost:4000}
      DFL_EMBED: ${DFL_EMBED:-hash}
      DFL_LLM: ${DFL_LLM:-}
      DFL_ADMINS: ${DFL_ADMINS:-}
      DFL_DEFAULT_ROLE: ${DFL_DEFAULT_ROLE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
    volumes:
      - ${VAULT_PATH:-./vault}:/vault
      - defluance-data:/data
    ports:
      - "${DFL_BIND:-127.0.0.1}:${DFL_HTTP_PORT:-4000}:4000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: defluance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: defluance
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defluance -d defluance"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [defluance]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"

volumes:
  defluance-data:
  postgres-data:
  caddy-data:
